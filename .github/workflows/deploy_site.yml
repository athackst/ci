name: Deploy a Site

on:
  workflow_call:
    inputs:
      type:
        description: "(Deprecated) Ignored; deployment always uses GitHub Pages Actions"
        type: string
        default: ""
        required: false
      enablement:
        description: "Try to enable Pages for the repository if it is not already enabled."
        type: boolean
        default: false
        required: false
      version:
        description: Optional Version identifier to publish, for example 1.2.3
        type: string
        required: false
        default: ""
      artifact-name:
        description: The name of the site artifact
        type: string
        required: false
        default: "github-pages"
      branch:
        description: Optional deployment branch.
        type: string
        required: false
        default: "gh-pages"
      dry-run:
        description: Optional dry run
        type: boolean
        required: false
        default: false
    secrets:
      token:
        description: Optional token override used by configure-pages.
        required: false

concurrency:
  group: site-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy-action:
    permissions:
      pages: write
      id-token: write
    needs: prepare-versioned
    if: >-
      ${{ !cancelled() && !inputs.dry-run &&
          (inputs.version == '' || needs.prepare-versioned.result == 'success') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Warn about deprecated type input
        if: ${{ inputs.version == '' && inputs.type != '' }}
        run: echo "::warning::The 'type' input is deprecated and ignored. Remove it; this workflow deploys through GitHub Pages Actions."

      - name: Setup Pages
        if: ${{ inputs.enablement && !inputs.dry-run }}
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.token || github.token }}
          enablement: ${{ inputs.enablement }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.version != '' && format('versioned-{0}', inputs.artifact-name) || inputs.artifact-name }}

      - name: Workflow summary
        if: ${{ always() }}
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Pages Deployment"
            echo "- Result: $DEPLOYMENT_OUTCOME"
            echo "- URL: $PAGE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-versioned:
    permissions:
      contents: write
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Warn about deprecated type input
        if: ${{ inputs.type != '' }}
        run: echo "::warning::The 'type' input is deprecated and ignored. Remove it; this workflow deploys through GitHub Pages Actions."

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ./artifact

      - name: Extract site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f ./artifact/artifact.tar ]; then
            tar --directory _site -xvf ./artifact/artifact.tar
          else
            TAR_FILE="$(find ./artifact -maxdepth 2 -type f -name '*.tar' | head -n1)"
            if [ -n "$TAR_FILE" ]; then
              tar --directory _site -xvf "$TAR_FILE"
            else
              cp -R ./artifact/. _site/
            fi
          fi

      - name: Settings
        id: settings
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          alias=""
          echo "version=${VERSION}" | tee -a "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "release" ] || [ -n "$RELEASE_TAG" ]; then
            alias="latest"
          fi
          echo "alias=${alias}" | tee -a "$GITHUB_OUTPUT"

      - name: Pick default target
        id: pick-default
        shell: bash
        env:
          ALIAS: ${{ steps.settings.outputs.alias }}
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ steps.settings.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH" --depth=1

            # If the alias exists on the branch, use it as default-to.
            if git show "origin/${BRANCH}:${ALIAS}/index.html" >/dev/null 2>&1; then
              echo "value=${ALIAS}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Deploy to branch with versite
        uses: PrimerPages/versite@main
        with:
          version: ${{ steps.settings.outputs.version }}
          aliases: ${{ steps.settings.outputs.alias }}
          default-to: ${{ steps.pick-default.outputs.value }}
          branch: ${{ inputs.branch }}
          site-dir: _site
          push: ${{ !inputs.dry-run }}

      - name: Export versioned site
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/versioned-site"
          git archive --format=tar "$BRANCH" | tar --extract --directory "$RUNNER_TEMP/versioned-site"

      - name: Upload complete versioned site
        uses: actions/upload-pages-artifact@v5
        with:
          name: versioned-${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/versioned-site

      - name: Workflow summary
        if: ${{ always() }}
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "### Versioned Site"
            echo "- Version: $VERSION"
            echo "- Branch: $BRANCH"
            echo "- Dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
