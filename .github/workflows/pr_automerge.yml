name: PR Automerge

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  # The latest event reconciles the live PR state.
  group: "pr-automerge-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  pr-automerge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: athackst/ci/.github/workflows/automerge.yml@main
    with:
      automerge-mode: native
    secrets:
      token: ${{ secrets.CI_BOT_TOKEN }}
