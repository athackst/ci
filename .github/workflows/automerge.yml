name: Automerge
on:
  workflow_call:
    inputs:
      automerge-mode:
        description: Merge strategy for PRs labeled automerge.
        type: string
        required: false
        default: poll
    secrets:
      token:
        description: Token used to inspect labels, enable auto-merge, and merge pull requests.
        required: true

jobs:
  precheck:
    if: ${{ github.event.pull_request.state == 'open' && (github.event.action == 'labeled' || github.event.action == 'unlabeled' || github.event.action == 'ready_for_review') }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Check automerge mode
        id: automerge-mode
        shell: bash
        env:
          AUTOMERGE_MODE: ${{ inputs.automerge-mode }}
        run: |
          set -euo pipefail
          case "$AUTOMERGE_MODE" in
            poll|native|disabled) ;;
            *)
              echo "Unsupported automerge mode: $AUTOMERGE_MODE"
              exit 1
              ;;
          esac
          echo "mode=$AUTOMERGE_MODE" | tee -a "$GITHUB_OUTPUT"

      - name: Check gh auth identity
        id: auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "token is empty; set the repository secret the caller maps to it." >&2
            exit 1
          fi

          if ! VIEWER_LOGIN="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login')"; then
            echo "token did not authenticate." >&2
            exit 1
          fi

          echo "viewer-login=$VIEWER_LOGIN" | tee -a "$GITHUB_OUTPUT"

      - name: Check automerge label
        id: automerge-label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          set -euo pipefail
          HAS_AUTOMERGE_LABEL="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels --jq 'any(.labels[]?; .name == "automerge")')"
          echo "has-automerge-label=$HAS_AUTOMERGE_LABEL" | tee -a "$GITHUB_OUTPUT"

      - name: Check PR origin and remove fork automerge label
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
          HAS_AUTOMERGE_LABEL: ${{ steps.automerge-label.outputs.has-automerge-label }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_SELF=false
          if [ -n "$HEAD_REPOSITORY" ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            IS_SELF=true
          fi
          echo "is-self=$IS_SELF" | tee -a "$GITHUB_OUTPUT"

          AUTOMERGE_LABEL_REMOVED=false
          if [ "$HAS_AUTOMERGE_LABEL" = "true" ] && [ "$IS_SELF" != "true" ]; then
            echo "Removing automerge label from fork PR #${{ github.event.pull_request.number }}."
            gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label automerge
            AUTOMERGE_LABEL_REMOVED=true
          fi
          echo "automerge-label-removed=$AUTOMERGE_LABEL_REMOVED" | tee -a "$GITHUB_OUTPUT"

      - name: Configure automerge mode
        id: decision
        shell: bash
        env:
          CONFIGURED_MODE: ${{ steps.automerge-mode.outputs.mode }}
          HAS_AUTOMERGE_LABEL: ${{ steps.automerge-label.outputs.has-automerge-label }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          IS_SELF: ${{ steps.origin.outputs.is-self }}
          AUTOMERGE_LABEL_REMOVED: ${{ steps.origin.outputs.automerge-label-removed }}
        run: |
          set -euo pipefail
          MODE=""
          REASON=""

          if [ "$AUTOMERGE_LABEL_REMOVED" = "true" ]; then
            REASON="Automerge label was removed because pull request head repository is a fork."
          elif [ "$CONFIGURED_MODE" = "disabled" ]; then
            REASON="Automerge mode is disabled."
          elif [ "$IS_SELF" != "true" ]; then
            REASON="Pull request head repository is a fork."
          elif [ "$IS_DRAFT" = "true" ]; then
            REASON="PR is draft."
          elif [ "$CONFIGURED_MODE" = "poll" ] && [ "$HAS_AUTOMERGE_LABEL" = "true" ]; then
            MODE="poll"
          elif [ "$CONFIGURED_MODE" = "native" ] && [ "$HAS_AUTOMERGE_LABEL" = "true" ]; then
            MODE="native"
          else
            REASON="Automerge state is not active."
          fi

          echo "mode=$MODE" | tee -a "$GITHUB_OUTPUT"
          echo "reason=$REASON" | tee -a "$GITHUB_OUTPUT"

  merge:
    needs: precheck
    if: ${{ needs.precheck.result == 'success' && needs.precheck.outputs.mode != '' }}
    permissions:
      contents: write
      pull-requests: write
      checks: read
    runs-on: ubuntu-latest
    steps:
      - name: Enable native auto-merge for labeled PR
        if: ${{ needs.precheck.outputs.mode == 'native' }}
        id: native-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          set -euo pipefail
          PR_STATE="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json state --jq '.state')"
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "merge-summary=Skipped native auto-merge because PR is not open." | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Enabling native automerge for PR #${{ github.event.pull_request.number }}."
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --squash
          echo "merge-summary=Enabled auto-merge." | tee -a "$GITHUB_OUTPUT"

      - name: GitHub Checks
        if: ${{ needs.precheck.outputs.mode == 'poll' }}
        id: checks
        uses: wechuli/allcheckspassed@v2
        continue-on-error: true
        with:
          token: ${{ secrets.token }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
          delay: "0"
          polling_interval: "1"
          retries: "10"
          checks_exclude: ".*automerge.*$"
          treat_neutral_as_passed: "true"

      - name: Merge labeled PR after checks pass
        id: poll-merge
        if: ${{ needs.precheck.outputs.mode == 'poll' && steps.checks.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          set -euo pipefail

          # Check that the PR is still open and has the automerge label before merging
          PR_DATA="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json state,labels)"
          PR_STATE="$(printf '%s' "$PR_DATA" | jq -r '.state')"
          HAS_AUTOMERGE_LABEL="$(printf '%s' "$PR_DATA" | jq -r 'any(.labels[]?; .name == "automerge")')"
          echo "pr-state=$PR_STATE" | tee -a "$GITHUB_OUTPUT"
          echo "has-automerge-label=$HAS_AUTOMERGE_LABEL" | tee -a "$GITHUB_OUTPUT"

          if [ "$PR_STATE" != "OPEN" ]; then
            echo "merge-summary=Skipped merge because the PR is no longer open." | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_AUTOMERGE_LABEL" != "true" ]; then
            echo "merge-summary=Skipped merge because the automerge label was removed." | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash
          echo "merge-summary=Merged PR." | tee -a "$GITHUB_OUTPUT"

      - name: Workflow summary
        if: ${{ always() }}
        id: workflow-summary
        shell: bash
        env:
          AUTOMERGE_MODE: ${{ inputs.automerge-mode }}
          AUTOMERGE_RESULT: ${{ needs.precheck.outputs.mode == 'native' && steps.native-merge.outcome || needs.precheck.outputs.mode == 'poll' && steps.poll-merge.outcome || 'skipped' }}
          AUTOMERGE_SUMMARY: ${{ steps.native-merge.outputs.merge-summary || steps.poll-merge.outputs.merge-summary }}
          PRECHECK_RESULT: ${{ needs.precheck.result }}
          PRECHECK_REASON: ${{ needs.precheck.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "### Automerge"
            echo ""
            echo "mode: \`${AUTOMERGE_MODE}\`"
            echo ""
            if [ "${PRECHECK_RESULT}" != "success" ]; then
              echo "Precheck did not complete successfully."
            elif [ -n "${PRECHECK_REASON}" ]; then
              echo "Skipped: ${PRECHECK_REASON}"
            elif [ "${AUTOMERGE_RESULT}" = "failure" ]; then
              echo "Automerge did not complete successfully."
            elif [ -n "${AUTOMERGE_SUMMARY}" ]; then
              echo "${AUTOMERGE_SUMMARY}"
            else
              echo "No automerge change was made."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
